schema_version: "0.1"
scenario_id: "train_shielded_two_source_v0"
split: "train"
seed: 19
time_step_s: 0.25
metadata:
  description: "Two synthetic gamma sources with concrete and steel shielding"
  authoring_status: "reference"

world:
  bounds:
    x_min: 0.0
    x_max: 10.0
    y_min: 0.0
    y_max: 7.0
  obstacles:
    - id: "concrete_wall"
      x_min: 4.0
      x_max: 4.35
      y_min: 0.5
      y_max: 5.5
      material: "concrete"
    - id: "steel_cabinet"
      x_min: 6.0
      x_max: 7.0
      y_min: 2.6
      y_max: 3.2
      material: "steel"

materials:
  air:
    linear_attenuation_per_m: 0.0
  concrete:
    linear_attenuation_per_m: 0.4
  steel:
    linear_attenuation_per_m: 1.4

sources:
  - id: "source_left"
    x: 2.2
    y: 5.8
    reference_cps_at_1m: 120.0
    isotope: "synthetic_gamma"
  - id: "source_right"
    x: 8.2
    y: 1.4
    reference_cps_at_1m: 190.0
    isotope: "synthetic_gamma"

detector:
  integration_time_s: 0.5
  background_cps: 4.0
  efficiency: 0.8
  max_cps: 5000.0
  dead_time_s: 0.00002
  min_distance_m: 0.25
  directional_exponent: 1.0

robot:
  start:
    x: 1.0
    y: 1.0
    yaw: 0.0
  max_linear_velocity_mps: 0.75
  max_angular_velocity_rps: 1.2
  pose_mode: "noisy_odometry"
  odometry_noise:
    translation_std_m: 0.02
    rotation_std_rad: 0.02

task:
  type: "source_localization"
  max_steps: 480
  dose_budget: 1100.0
  localization_tolerance_m: 1.2

