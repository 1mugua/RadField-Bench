schema_version: "0.1"
scenario_id: "train_open_room_single_source_v0"
split: "train"
seed: 7
time_step_s: 0.25
metadata:
  description: "Open room single gamma source for smoke tests and baseline development"
  authoring_status: "reference"

world:
  bounds:
    x_min: 0.0
    x_max: 8.0
    y_min: 0.0
    y_max: 6.0
  obstacles: []

materials:
  air:
    linear_attenuation_per_m: 0.0
  concrete:
    linear_attenuation_per_m: 0.35
  steel:
    linear_attenuation_per_m: 1.2

sources:
  - id: "source_01"
    x: 6.4
    y: 4.5
    reference_cps_at_1m: 160.0
    isotope: "synthetic_gamma"

detector:
  integration_time_s: 0.5
  background_cps: 3.0
  efficiency: 0.85
  max_cps: 5000.0
  dead_time_s: 0.00002
  min_distance_m: 0.25
  directional_exponent: 0.0

robot:
  start:
    x: 1.0
    y: 1.0
    yaw: 0.0
  max_linear_velocity_mps: 0.8
  max_angular_velocity_rps: 1.2

task:
  type: "source_localization"
  max_steps: 320
  dose_budget: 850.0
  localization_tolerance_m: 1.0

